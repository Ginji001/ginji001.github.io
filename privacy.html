<h1>プライバシーポリシー</h1>
<p>rclone-backup は、所有者本人のみが利用する個人用のバックアップ設定です。</p>
<ul>
<li>Googleドライブへのアクセスは、所有者自身のファイルをバックアップ・復元する目的にのみ使用します。</li>
<li>取得したデータを第三者に提供・販売・共有することはありません。</li>
<li>データは所有者の自宅サーバーと所有者のGoogleドライブの間でのみ転送されます。</li>
<li>アクセス権は、Googleアカウントの「サードパーティ製のアプリとサービス」からいつでも取り消せます。</li>
</ul>
